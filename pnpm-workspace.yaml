allowBuilds:
  "@parcel/watcher": true
  "@sentry/cli": true
  "@swc/core": true
  "@tailwindcss/oxide": true
  esbuild: true
  sharp: true
  unrs-resolver: true

# Our own packages are published by our own tagged workflows; minimumReleaseAge
# would refuse each fresh publish until it ages. One scope glob covers every
# @bitbaum package; the four unscoped ones are named (fleet SHARED.md).
minimumReleaseAgeExclude:
  - "@bitbaum/*"
  - limitkit
  - bip-kit
  - threadkit
  - ai-forms

# Security floors for transitive dependencies (2026-10-30). Each is the
# advisory's first patched version, bounded to one major. vite arrives through
# vitest (dev, and better-auth's optional vitest peer); nothing serves it at
# runtime. Drop a line once its parent ships a fixed range.
overrides:
  vite: ^8.1.6
  source-map-js@1: ^1.2.2
