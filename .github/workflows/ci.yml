# Golden CI floor — see dotfiles/templates/ci/README.md.
# vitareba: pnpm + vitest. 55 test files / ~798 cases that, until now, never ran
# on the shared branch. This gate runs them on every push & PR to main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # SSOT: one definition of "verified" (lint + typecheck + test) lives in
      # package.json `verify`, run identically here and locally. Change the
      # checks in one place, not two.
      - name: Verify
        run: pnpm run verify

      - name: Build
        env:
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
        run: pnpm run build
