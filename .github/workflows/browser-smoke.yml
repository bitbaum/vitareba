name: Browser smoke

# The patient's way in, in real Chromium, against the production server and a
# real PostgreSQL built from the committed migrations — once on today's
# runtime (NextAuth) and once on AccountKit (AUTH_RUNTIME=accountkit) after the
# real import. The fleet's shared-package gate requires this workflow on any
# pull request that changes a shared account package. Synthetic people only;
# no mail is sent (RESEND_API_KEY is unset).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: browser-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  patient-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: vita_smoke
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d vita_smoke"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://app:app@127.0.0.1:5432/vita_smoke
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
      AUTH_SECRET: synthetic-browser-smoke-secret-at-least-32-chars
      BETTER_AUTH_SECRET: synthetic-browser-smoke-secret-at-least-32-chars
      AUTH_TRUST_HOST: "true"
      BASE_URL: http://localhost:3000
      BROWSER_EXECUTABLE: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Apply the committed migrations
        run: for file in drizzle/[0-9]*.sql; do psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$file"; done

      - run: pnpm run build
      - name: Assemble the standalone server
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public

      - name: Journey on NextAuth
        run: |
          (cd .next/standalone && PORT=3000 HOSTNAME=127.0.0.1 node server.js > ../../server-nextauth.log 2>&1 &)
          for i in $(seq 60); do curl -sf -o /dev/null http://localhost:3000/de/login && break; sleep 1; done
          SMOKE_LABEL=nextauth node scripts/browser-smoke.mjs
          pkill -f next-server || true

      # Only where the shared runtime is staged (lib/auth/shared, the import).
      - name: Import into AccountKit, as the switch would
        if: hashFiles('scripts/db/accountkit-import.sql') != ''
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 --single-transaction -q -f scripts/db/accountkit-import.sql

      - name: Journey on AccountKit
        if: hashFiles('scripts/db/accountkit-import.sql') != ''
        env:
          AUTH_RUNTIME: accountkit
          SMOKE_IMPORTED_EMAIL: smoke-nextauth@example.test
        run: |
          for i in $(seq 30); do curl -sf -o /dev/null http://localhost:3000/ || break; sleep 1; done
          (cd .next/standalone && PORT=3000 HOSTNAME=127.0.0.1 node server.js > ../../server-accountkit.log 2>&1 &)
          for i in $(seq 60); do curl -sf -o /dev/null http://localhost:3000/de/login && break; sleep 1; done
          SMOKE_LABEL=accountkit node scripts/browser-smoke.mjs

      - name: Keep screenshots and server logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vita-browser-smoke
          path: |
            browser-smoke-artifacts/
            server-*.log
          retention-days: 14
          if-no-files-found: warn
